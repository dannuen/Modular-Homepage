<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage — harness</title>
<link rel="stylesheet" href="/www/obsidian-base.css">
<script src="/www/obsidian-mock.js"></script>
<script src="/www/inspect.js"></script>
</head>
<body class="mod-windows is-frameless is-hidden-frameless obsidian-app show-inline-title show-view-header is-focused">
<div class="app-container">
	<div class="horizontal-main-container">
		<div class="workspace">
			<div class="workspace-split mod-vertical mod-root">
				<div class="workspace-tabs mod-top mod-active">
					<div class="workspace-tab-container">
						<div class="workspace-leaf mod-active">
							<div class="workspace-leaf-content" data-type="markdown" data-mode="preview">
								<div class="view-content">
									<div class="markdown-reading-view">
										<div class="markdown-preview-view markdown-rendered node-insert-event is-readable-line-width allow-fold-headings show-indentation-guide allow-fold-lists show-properties" tabindex="-1">
											<div class="markdown-preview-sizer markdown-preview-section"></div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script src="/www/boot.js"></script>
</body>
</html>
